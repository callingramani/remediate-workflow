version: "3.8"
services:
  remediate:
    build: ./remediate_service
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
    depends_on:
      - redis
    volumes:
      - ./remediate_service/data:/app/data
  worker:
    build: ./remediate_service
    command: rq worker -u redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./remediate_service:/app
    environment:
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - remediate
